<!-- simulator.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYFR - Live Ledger Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f1219; 
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(29, 78, 216, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(220, 38, 38, 0.1), transparent 25%);
            color: #D1D5DB; 
        }
        .tech-font { font-family: 'JetBrains Mono', monospace; }
        .bg-grid {
            background-size: 40px 40px;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center overflow-hidden relative">
    <div class="bg-grid"></div>
    <div class="absolute top-6 left-6 z-20">
        <button onclick="window.location.href='ui.html'" class="flex items-center space-x-2 bg-[#1c2230] border border-gray-700 hover:border-blue-500 text-gray-400 hover:text-blue-400 px-4 py-2 rounded-lg text-sm font-bold tracking-wide transition duration-200 shadow-lg">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            <span>BACK TO DASHBOARD</span>
        </button>
    </div>
    <div class="w-full max-w-2xl bg-[#1c2230]/80 backdrop-blur-md p-8 rounded-2xl border border-gray-800 shadow-2xl relative z-10">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold text-white tracking-widest mb-2">CYFR<span class="text-blue-500">.</span> NODE SIMULATOR</h1>
            <p class="text-xs text-gray-500 mt-2">Test Local Hashing and Tamper Detection</p>
        </div>
        <div class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Original Civil Registry Record</label>
                <input type="text" id="recordInput" value="Citizen: Juan Dela Cruz | Status: Married" class="w-full bg-[#131722] border border-gray-700 text-sm rounded-lg px-4 py-3 focus:outline-none focus:border-blue-500 text-white">
            </div>
            <button onclick="hashData()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg transition duration-200">
                GENERATE SECURE HASH
            </button>
            <div class="bg-[#131722] p-4 rounded-lg border border-gray-700 relative">
                <button onclick="clearLogs()" class="absolute top-2 right-2 text-xs text-gray-500 hover:text-white transition">CLEAR</button>
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Generated SHA-256 Hash</label>
                <p id="hashOutput" class="tech-font text-xs text-blue-400 break-all">Waiting for input...</p>
            </div>
            <div class="pt-4 border-t border-gray-700">
                <label class="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Simulate Unauthorized Change</label>
                <div class="flex space-x-2">
                    <input type="text" id="tamperInput" value="Citizen: Juan Dela Cruz | Status: Single" class="w-full bg-[#131722] border border-gray-700 text-sm rounded-lg px-4 py-3 focus:outline-none focus:border-red-500 text-white">
                    <button onclick="tamperData()" class="bg-red-600 hover:bg-red-500 text-white font-bold py-3 px-4 rounded-lg transition duration-200 w-1/3 text-xs">
                        TEST TAMPERING
                    </button>
                </div>
            </div>
            <div id="alertBox" class="hidden bg-red-900/20 border border-red-500 p-4 rounded-lg text-center mt-4 transition">
                <p class="text-red-500 font-bold tracking-widest text-sm uppercase">Tamper Detected: Hashes Do Not Match!</p>
                <p id="tamperHashOutput" class="tech-font text-xs text-red-400 break-all mt-2"></p>
            </div>
            <div id="successBox" class="hidden bg-green-900/20 border border-green-500 p-4 rounded-lg text-center mt-4 transition">
                <p class="text-green-500 font-bold tracking-widest text-sm uppercase">Data is Secure and Authentic</p>
            </div>
        </div>
    </div>
    <script>
        let currentValidHash = "";
        async function createHash(message) {
            const encoder = new TextEncoder();
            const data = encoder.encode(message);
            const hashBuffer = await window.crypto.subtle.digest("SHA-256", data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }
        async function hashData() {
            const input = document.getElementById('recordInput').value;
            currentValidHash = await createHash(input);
            document.getElementById('hashOutput').innerText = currentValidHash;
            document.getElementById('alertBox').classList.add('hidden');
            document.getElementById('successBox').classList.remove('hidden');
        }
        async function tamperData() {
            if (!currentValidHash) {
                alert("Please generate the original hash first.");
                return;
            }
            const tamperedInput = document.getElementById('tamperInput').value;
            const tamperedHash = await createHash(tamperedInput);
            document.getElementById('successBox').classList.add('hidden');
            const alertBox = document.getElementById('alertBox');
            alertBox.classList.remove('hidden');
            document.getElementById('tamperHashOutput').innerText = "Tampered Hash: " + tamperedHash;
        }
        function clearLogs() {
            currentValidHash = "";
            document.getElementById('hashOutput').innerText = "Waiting for input...";
            document.getElementById('alertBox').classList.add('hidden');
            document.getElementById('successBox').classList.add('hidden');
        }
    </script>
</body>
</html>
