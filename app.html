<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CYFR Blockchain Middleware</title>
    <link rel="icon" href="assets/logo.png" />
    <!-- apply the saved light or dark theme before the page paints -->
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem("cyfr_theme") || "";
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="assets/app.css" />
  </head>

  <body>
    <div class="shell">
      <!-- sidebar: logo, pages, signed-in user -->
      <nav class="side" id="nav" aria-label="Main">
        <!-- LOGO: to change it, replace the file assets/logo.png -->
        <div class="brand">
          <img class="logo" src="assets/logo.png" alt="CYFR" />
          <div><b>CYFR</b><small id="orgname">Sample City IT Office</small></div>
        </div>

        <a href="#/overview"
          ><svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="3" width="7" height="9" rx="1" />
            <rect x="14" y="3" width="7" height="5" rx="1" />
            <rect x="14" y="12" width="7" height="9" rx="1" />
            <rect x="3" y="16" width="7" height="5" rx="1" /></svg
          >Overview</a
        >
        <a href="#/connections"
          ><svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <ellipse cx="12" cy="5" rx="8" ry="3" />
            <path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3" /></svg
          >Connections</a
        >
        <a href="#/ledger"
          ><svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" /></svg
          >Ledger</a
        >
        <a href="#/verify"
          ><svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            <path d="m9 12 2 2 4-4" /></svg
          >Verify records</a
        >
        <a href="#/networks"
          ><svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="5" cy="12" r="2.5" />
            <circle cx="19" cy="5" r="2.5" />
            <circle cx="19" cy="19" r="2.5" />
            <path d="M7.2 10.9l9.6-4.8M7.2 13.1l9.6 4.8" /></svg
          >Blockchain networks</a
        >
        <a href="#/reports"
          ><svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <path d="M14 2v6h6M8 13h8M8 17h6" /></svg
          >Reports</a
        >
        <a href="#/settings"
          ><svg
            viewBox="0 0 24 24"
            width="18"
            height="18"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12" />
            <circle cx="16" cy="6" r="2" />
            <circle cx="10" cy="12" r="2" />
            <circle cx="18" cy="18" r="2" /></svg
          >Settings</a
        >

        <div class="side-foot"><span id="who"></span><a href="index.html">Sign out</a></div>
      </nav>

      <div class="main">
        <!-- strip that says whether the data on screen is sample or live -->
        <div class="proto">
          Prototype with sample data. No real records, offices or networks are connected.
        </div>

        <!-- top bar: page title on the left, actions on the right -->
        <header class="top">
          <div>
            <h1 id="title"></h1>
            <p class="muted" id="sub"></p>
          </div>
          <div class="top-r">
            <button class="btn primary" id="addrec">Add record</button>
            <div class="bellw">
              <button class="btn" id="bell" aria-label="Notifications">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  style="vertical-align: -3px"
                >
                  <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0" />
                </svg>
                <span class="badge" id="bd" hidden></span>
              </button>
              <div class="np" id="np" hidden></div>
            </div>
            <button class="btn" id="theme" aria-label="Toggle dark mode">Dark mode</button>
            <span class="pill" id="net"></span>
            <button class="btn" id="outage">Simulate outage</button>
          </div>
        </header>

        <div id="banner"></div>
        <!-- outage and alert messages appear here -->
        <main id="view"></main>
        <!-- the current page is drawn here -->
      </div>
    </div>

    <div id="drawer" class="drawer" hidden></div>
    <!-- record details slide in from the right -->
    <div id="toast" class="toast" hidden></div>
    <!-- short confirmations -->

    <script src="assets/app.js"></script>
    <!-- screens and sample data -->
    <script src="assets/live.js"></script>
    <!-- switches to live data when served by the agent -->
  </body>
</html>
